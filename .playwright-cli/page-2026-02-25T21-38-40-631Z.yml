      - generic [ref=e428]:
        - generic [ref=e431]:
          - heading "What our partners say about us" [level=2] [ref=e432]
          - generic [ref=e433]:
            - generic [ref=e434]:
              - generic [ref=e436]:
                - generic [ref=e437]: WENDY'S QUALITY SUPPLY CHAIN CO-OP
                - generic [ref=e438]: "\"Now, we've not only fixed our inventory problem, we've now taken a problem that would go on for weeks and days and fixed it in five minutes, making our people incredibly efficient.\""
                - generic [ref=e439]:
                  - generic [ref=e440]: Pete Suerken
                  - generic [ref=e441]: President & CEO, Wendy's Quality Supply Chain Co-op
              - generic [ref=e443]:
                - generic [ref=e444]: WALGREENS
                - generic [ref=e445]: "\"We started with the goal of piloting 10 stores within about six months. However, leveraging Foundry and AIP, we began to see real promise quickly in composing AI-powered, end-to-end workflows that allowed us to get to about 4000 stores within eight months.\""
                - generic [ref=e446]:
                  - generic [ref=e447]: Jeff Hoffman
                  - generic [ref=e448]: Walgreens, VP, Product Pharmacy
              - generic [ref=e450]:
                - generic [ref=e451]: AT&T
                - generic [ref=e452]: "\"[S.C.O.U.T] began as a joint effort between AT&T and Palantir, and now has over 100 AT&T dedicated engineers and a dedicated support team…for this application. It's just one of the 660 applications we have on Foundry today.\""
                - generic [ref=e453]:
                  - generic [ref=e454]: Dan Wagner
                  - generic [ref=e455]: Dir. of Technology, AT&T
              - generic [ref=e457]:
                - generic [ref=e458]: PAREXEL
                - generic [ref=e459]: "\"We estimate that this solution reduces our time to submission materials by over 50% from the current 10 to 12 week average to around 3 to 4 weeks. We can create this process, manage the process, standardize it...and cut [in] half the time that is required to get there.\""
                - generic [ref=e460]:
                  - generic [ref=e461]: Dan Ballard
                  - generic [ref=e462]: SVP Digital Innovation, Parexel
              - generic [ref=e464]:
                - generic [ref=e465]: HEINEKEN
                - generic [ref=e466]: "\"We had a great chassis of the car. But our engine was underpowered. So we went to Palantir because we want to have the best engine out there...In three months, [the teams] built what took us three years before.\""
                - generic [ref=e467]:
                  - generic [ref=e468]: Laurens van de Rotte
                  - generic [ref=e469]: Chief Operating Officer, Heineken USA
              - generic [ref=e471]:
                - generic [ref=e472]: WALGREENS
                - generic [ref=e473]: "\"We needed to start scaling and building out autonomous orchestration. If we were to rely on humans solely...that would amount to about 384 billion decisions every day. It would be flat out impossible.\""
                - generic [ref=e474]:
                  - generic [ref=e475]: Jeff Hoffman
                  - generic [ref=e476]: Walgreens, VP, Product Pharmacy
              - generic [ref=e478]:
                - generic [ref=e479]: L3HARRIS
                - generic [ref=e480]: "\"I did not want a dashboard to tell me I was in trouble. I know when I'm in trouble. I wanted someone to give me some predictives, and some ways to...get me not only technologically advanced, but decisionally be more agile and and able to maximize cost [savings] and efficiencies.\""
                - generic [ref=e481]:
                  - generic [ref=e482]: Jay Abendroth
                  - generic [ref=e483]: President, Integrated Vision Solutions Sector, L3Harris
              - generic [ref=e485]:
                - generic [ref=e486]: SOMPO JAPAN
                - generic [ref=e487]: "\"So, what was the impact? Over the last three years, we have seen a $60 million improvement in profit. And we expect an additional $100M over the next three years.\""
                - generic [ref=e488]:
                  - generic [ref=e489]: Akiko Murakami
                  - generic [ref=e490]: Sompo, Chief Technology Officer
              - generic [ref=e492]:
                - generic [ref=e493]: GENERAL MILLS
                - generic [ref=e494]: "\"We’re saving on average about $40,000 a day, which is about $14M annually – and it’s really only deployed to part of our network.\""
                - generic [ref=e495]:
                  - generic [ref=e496]: Dave Jackett
                  - generic [ref=e497]: General Mills, Sr. Director Supply Chain Digital Transformation
              - generic [ref=e499]:
                - generic [ref=e500]: AARP
                - generic [ref=e501]: "\"Foundry and AIP have been terrific for us. We launched the first prototype within 45 days. And that was just amazing from my perspective.\""
                - generic [ref=e502]:
                  - generic [ref=e503]: Sami Hassanyeh
                  - generic [ref=e504]: AARP, SVP Digital Strategy & Membership
              - generic [ref=e506]:
                - generic [ref=e507]: LOWE'S
                - generic [ref=e508]: "\"In less than four months, we created something from POC all the way to production. Palantir has made us faster and smarter.\""
                - generic [ref=e509]:
                  - generic [ref=e510]: Elaina Wheeldon
                  - generic [ref=e511]: Lowe's, VP Data Products, Applied AI, & Analytics
              - generic [ref=e513]:
                - generic [ref=e514]: CAZ INVESTMENTS
                - generic [ref=e515]: "\"With AIP, we can now process over 100 times more leads with the same amount of resources. This has reduced our lead processing time by over 90%. This would not have been possible without AIP.\""
                - generic [ref=e516]:
                  - generic [ref=e517]: James Stuard
                  - generic [ref=e518]: CAZ Investments, VP of Finance
              - generic [ref=e520]:
                - generic [ref=e521]: PANASONIC ENERGY NORTH AMERICA
                - generic [ref=e522]: "\"Ask Atom [powered by Palantir AIP] serves as a vital training tool for our new, and even veteran technicians – cutting that 3-6 month learning curve down to just a few weeks.\""
                - generic [ref=e523]:
                  - generic [ref=e524]: Tara Meisinger
                  - generic [ref=e525]: Panasonic Energy North America, Sr. Maintenance Manager
              - generic [ref=e527]:
                - generic [ref=e528]: UNITED AIRLINES
                - generic [ref=e529]: "\"We deployed Chime late last year…we’ve already saved almost 300 delays, 20 cancellations...this represents millions of dollars of cost avoidance.\""
                - generic [ref=e530]:
                  - generic [ref=e531]: Luis Mesen
                  - generic [ref=e532]: United Airlines, Dir. Of Tech Ops Data Analytics
              - generic [ref=e534]:
                - generic [ref=e535]: FUJITSU
                - generic [ref=e536]: "\"We've combined Foundry's data integration capabilities and Fujitsu's machine learning AI to transform our operations … creating alert systems, demand forecasting, inventory control systems, and so on. This transformation resulted in an impressive annual cost reduction of $9M within just 3 months.\""
                - generic [ref=e537]:
                  - generic [ref=e538]: Kazuki Hiraiso
                  - generic [ref=e539]: Fujitsu, Data Scientist
              - generic [ref=e541]:
                - generic [ref=e542]: ESI
                - generic [ref=e543]: "\"I attended a bootcamp not too long ago...and in 90 minutes, [the team] built an AIP module that was able to read a very poorly made scan...and issue a remarkably good judgment. This has blown our minds.\""
                - generic [ref=e544]:
                  - generic [ref=e545]: Timothy Gotsick
                  - generic [ref=e546]: ESI, Vice President Technology and Innovation
              - generic [ref=e548]:
                - generic [ref=e549]: PAREXEL
                - generic [ref=e550]: "\"On the technology side, we were looking for a partner and an approach to our data strategy, if you will excuse the term, that actually produced s***.\""
                - generic [ref=e551]:
                  - generic [ref=e552]: Jonathan Shough
                  - generic [ref=e553]: Parexel, Chief Information Officer
              - generic [ref=e555]:
                - generic [ref=e556]: LENNAR
                - generic [ref=e557]: "\"It was totally quiet for 14 minutes. People were just in awe. All total hell broke loose, because people completely couldn’t believe what they had seen.\""
                - generic [ref=e558]:
                  - generic [ref=e559]: Scott Spradley
                  - generic [ref=e560]: Lennar, Chief Technology Officer
              - generic [ref=e562]:
                - generic [ref=e563]: ARCHER AVIATION
                - generic [ref=e564]: "\"We’ve been able to build an ontology...and really get this all to come together in a faster time scale than ever been seen for an aircraft certification program of this magnitude.\""
                - generic [ref=e565]:
                  - generic [ref=e566]: Adam Wormoth
                  - generic [ref=e567]: Archer Aviation, Head of Product
              - generic [ref=e569]:
                - generic [ref=e570]: CUMMINS
                - generic [ref=e571]: "\"You’ve got to have the right technology to be able to access [your data] fast...efficiently. That’s the difference with Foundry and building ontologies.\""
                - generic [ref=e572]:
                  - generic [ref=e573]: Jim Jacob
                  - generic [ref=e574]: Cummins, VP Executive Director, Digitalization, Advanced Analytics and Artificial Intelligence
              - generic [ref=e576]:
                - generic [ref=e577]: JACOBS
                - generic [ref=e578]: "\"Palantir's frontline mixed reality capabilities...will complement our technology goals of worker enablement and job site safety. No matter what industrial site our teams are at...workers gain access to data and insights in the field where it's most relevant and critical.\""
                - generic [ref=e579]:
                  - generic [ref=e580]: Shannon Miller
                  - generic [ref=e581]: Jacobs, SVP Digital Strategy
              - generic [ref=e583]:
                - generic [ref=e584]: TAMPA GENERAL HOSPITAL
                - generic [ref=e585]: "\"Palantir is going to be front and center for everything that we do…[the platform] is a strategic differentiator for us.\""
                - generic [ref=e586]:
                  - generic [ref=e587]: John Couris
                  - generic [ref=e588]: Tampa General Hospital, CEO
              - generic [ref=e590]:
                - generic [ref=e591]: NORTHWIND TECHNICAL SERVICES
                - generic [ref=e592]: "\"We chose Palantir because their products are absolutely best in the class. We partnered with Palantir because their core values match with Northwind core values. And last, we win with Palantir because this relationship will make us a better competitor.\""
                - generic [ref=e593]:
                  - generic [ref=e594]: Michael Bosworth
                  - generic [ref=e595]: NorthWind Technical Services, Founder & CEO
              - generic [ref=e597]:
                - generic [ref=e598]: EATON
                - generic [ref=e599]: "\"We like to say that we make what matters work. Palantir is helping us focus on what matters.\""
                - generic [ref=e600]:
                  - generic [ref=e601]: Brian Fifarek
                  - generic [ref=e602]: Eaton, Vice President Supply Chain Digitalization
              - generic [ref=e604]:
                - generic [ref=e605]: HCA HEALTHCARE
                - generic [ref=e606]: "\"We have a better-balanced schedule. We have a better complement of competencies every single day. A unique feature of this scheduling system also allows us to balance it out in the future.\""
                - generic [ref=e607]:
                  - generic [ref=e608]: Dr. Michael Schlosser
                  - generic [ref=e609]: HCA Healthcare, SVP Care Transformation and Innovation
              - generic [ref=e611]:
                - generic [ref=e612]: CINTRA FERROVIAL
                - generic [ref=e613]: "\"It is important that in real-time we can send out help right away. So that we can not only make our operations more efficient, but it can save lives.\""
                - generic [ref=e614]:
                  - generic [ref=e615]: Jen Duthie
                  - generic [ref=e616]: Cintra Ferrovial, Head of Innovation
              - generic [ref=e618]:
                - generic [ref=e619]: CPKC
                - generic [ref=e620]: "\"We are building for the future, on a platform that we think is scalable for the future.\""
                - generic [ref=e621]:
                  - generic [ref=e622]: Shailesh Yerram
                  - generic [ref=e623]: CPKC, AVP, Business Intelligence & CISO
