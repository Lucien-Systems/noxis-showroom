      - generic [ref=e409]:
        - generic [ref=e412]:
          - heading "What our partners say about us" [level=2] [ref=e413]
          - generic [ref=e414]:
            - generic [ref=e415]:
              - generic [ref=e417]:
                - generic [ref=e418]: WENDY'S QUALITY SUPPLY CHAIN CO-OP
                - generic [ref=e419]: "\"Now, we've not only fixed our inventory problem, we've now taken a problem that would go on for weeks and days and fixed it in five minutes, making our people incredibly efficient.\""
              - generic [ref=e421]:
                - generic [ref=e422]: WALGREENS
                - generic [ref=e423]: "\"We started with the goal of piloting 10 stores within about six months. However, leveraging Foundry and AIP, we began to see real promise quickly in composing AI-powered, end-to-end workflows that allowed us to get to about 4000 stores within eight months.\""
              - generic [ref=e425]:
                - generic [ref=e426]: AT&T
                - generic [ref=e427]: "\"[S.C.O.U.T] began as a joint effort between AT&T and Palantir, and now has over 100 AT&T dedicated engineers and a dedicated support team…for this application. It's just one of the 660 applications we have on Foundry today.\""
              - generic [ref=e429]:
                - generic [ref=e430]: PAREXEL
                - generic [ref=e431]: "\"We estimate that this solution reduces our time to submission materials by over 50% from the current 10 to 12 week average to around 3 to 4 weeks. We can create this process, manage the process, standardize it...and cut [in] half the time that is required to get there.\""
              - generic [ref=e433]:
                - generic [ref=e434]: HEINEKEN
                - generic [ref=e435]: "\"We had a great chassis of the car. But our engine was underpowered. So we went to Palantir because we want to have the best engine out there...In three months, [the teams] built what took us three years before.\""
              - generic [ref=e437]:
                - generic [ref=e438]: WALGREENS
                - generic [ref=e439]: "\"We needed to start scaling and building out autonomous orchestration. If we were to rely on humans solely...that would amount to about 384 billion decisions every day. It would be flat out impossible.\""
              - generic [ref=e441]:
                - generic [ref=e442]: L3HARRIS
                - generic [ref=e443]: "\"I did not want a dashboard to tell me I was in trouble. I know when I'm in trouble. I wanted someone to give me some predictives, and some ways to...get me not only technologically advanced, but decisionally be more agile and and able to maximize cost [savings] and efficiencies.\""
              - generic [ref=e445]:
                - generic [ref=e446]: SOMPO JAPAN
                - generic [ref=e447]: "\"So, what was the impact? Over the last three years, we have seen a $60 million improvement in profit. And we expect an additional $100M over the next three years.\""
              - generic [ref=e449]:
                - generic [ref=e450]: GENERAL MILLS
                - generic [ref=e451]: "\"We’re saving on average about $40,000 a day, which is about $14M annually – and it’s really only deployed to part of our network.\""
              - generic [ref=e453]:
                - generic [ref=e454]: AARP
                - generic [ref=e455]: "\"Foundry and AIP have been terrific for us. We launched the first prototype within 45 days. And that was just amazing from my perspective.\""
              - generic [ref=e457]:
                - generic [ref=e458]: LOWE'S
                - generic [ref=e459]: "\"In less than four months, we created something from POC all the way to production. Palantir has made us faster and smarter.\""
              - generic [ref=e461]:
                - generic [ref=e462]: CAZ INVESTMENTS
                - generic [ref=e463]: "\"With AIP, we can now process over 100 times more leads with the same amount of resources. This has reduced our lead processing time by over 90%. This would not have been possible without AIP.\""
              - generic [ref=e465]:
                - generic [ref=e466]: PANASONIC ENERGY NORTH AMERICA
                - generic [ref=e467]: "\"Ask Atom [powered by Palantir AIP] serves as a vital training tool for our new, and even veteran technicians – cutting that 3-6 month learning curve down to just a few weeks.\""
              - generic [ref=e469]:
                - generic [ref=e470]: UNITED AIRLINES
                - generic [ref=e471]: "\"We deployed Chime late last year…we’ve already saved almost 300 delays, 20 cancellations...this represents millions of dollars of cost avoidance.\""
              - generic [ref=e473]:
                - generic [ref=e474]: FUJITSU
                - generic [ref=e475]: "\"We've combined Foundry's data integration capabilities and Fujitsu's machine learning AI to transform our operations … creating alert systems, demand forecasting, inventory control systems, and so on. This transformation resulted in an impressive annual cost reduction of $9M within just 3 months.\""
              - generic [ref=e477]:
                - generic [ref=e478]: ESI
                - generic [ref=e479]: "\"I attended a bootcamp not too long ago...and in 90 minutes, [the team] built an AIP module that was able to read a very poorly made scan...and issue a remarkably good judgment. This has blown our minds.\""
              - generic [ref=e481]:
                - generic [ref=e482]: PAREXEL
                - generic [ref=e483]: "\"On the technology side, we were looking for a partner and an approach to our data strategy, if you will excuse the term, that actually produced s***.\""
              - generic [ref=e485]:
                - generic [ref=e486]: LENNAR
                - generic [ref=e487]: "\"It was totally quiet for 14 minutes. People were just in awe. All total hell broke loose, because people completely couldn’t believe what they had seen.\""
              - generic [ref=e489]:
                - generic [ref=e490]: ARCHER AVIATION
                - generic [ref=e491]: "\"We’ve been able to build an ontology...and really get this all to come together in a faster time scale than ever been seen for an aircraft certification program of this magnitude.\""
              - generic [ref=e493]:
                - generic [ref=e494]: CUMMINS
                - generic [ref=e495]: "\"You’ve got to have the right technology to be able to access [your data] fast...efficiently. That’s the difference with Foundry and building ontologies.\""
              - generic [ref=e497]:
                - generic [ref=e498]: JACOBS
                - generic [ref=e499]: "\"Palantir's frontline mixed reality capabilities...will complement our technology goals of worker enablement and job site safety. No matter what industrial site our teams are at...workers gain access to data and insights in the field where it's most relevant and critical.\""
              - generic [ref=e501]:
                - generic [ref=e502]: TAMPA GENERAL HOSPITAL
                - generic [ref=e503]: "\"Palantir is going to be front and center for everything that we do…[the platform] is a strategic differentiator for us.\""
              - generic [ref=e505]:
                - generic [ref=e506]: NORTHWIND TECHNICAL SERVICES
                - generic [ref=e507]: "\"We chose Palantir because their products are absolutely best in the class. We partnered with Palantir because their core values match with Northwind core values. And last, we win with Palantir because this relationship will make us a better competitor.\""
              - generic [ref=e509]:
                - generic [ref=e510]: EATON
                - generic [ref=e511]: "\"We like to say that we make what matters work. Palantir is helping us focus on what matters.\""
              - generic [ref=e513]:
                - generic [ref=e514]: HCA HEALTHCARE
                - generic [ref=e515]: "\"We have a better-balanced schedule. We have a better complement of competencies every single day. A unique feature of this scheduling system also allows us to balance it out in the future.\""
              - generic [ref=e517]:
                - generic [ref=e518]: CINTRA FERROVIAL
                - generic [ref=e519]: "\"It is important that in real-time we can send out help right away. So that we can not only make our operations more efficient, but it can save lives.\""
              - generic [ref=e521]:
                - generic [ref=e522]: CPKC
                - generic [ref=e523]: "\"We are building for the future, on a platform that we think is scalable for the future.\""
            - generic [ref=e524]:
