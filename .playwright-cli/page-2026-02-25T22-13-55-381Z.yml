        - heading "Narrative Intelligence has become a top priority" [level=2] [ref=e57]
        - link "What is Narrative Risk?" [ref=e58] [cursor=pointer]:
          - /url: https://blackbird.ai/narrative-attacks/
      - paragraph [ref=e60]: Blackbird.AI created the world's first purpose-built AI-based Narrative Intelligence Platform, called Constellation, that automatically detects, analyzes and measures risk, and gains context around the impact of harmful narratives to clarify critical decision making.
      - paragraph [ref=e62]: We work diligently with top brands and national security organizations to protect them from narrative attacks and help them reduce the risk of financial and reputational harm.
    - generic [ref=e69]:
      - heading "Our Mission" [level=2] [ref=e70]
      - heading "To empower trust, safety, and integrity across the global information ecosystem." [level=3] [ref=e71]
    - generic [ref=e77]:
      - heading "Our Story" [level=2] [ref=e78]
      - generic [ref=e79]:
        - paragraph [ref=e80]: "In 2017, driven by a shared vision to tackle a profound societal challenge, computer scientists and co-founders Wasim Khaled and Dr. Naushad UzZaman embarked on a mission. They aimed to address one of the most pressing threats to society, which they viewed as an existential problem that kept them both up at night: narrative attacks and a future filled with AI-driven propaganda. This marked the inception of Blackbird.AI. As pioneers in the field, they bootstrapped their venture, channeling their passion into the creation of a mission-driven company focused on scalable technology solutions. The early team included a diverse mix of experts from fields such as artificial intelligence, national security, psychology, journalism, and healthcare, among others. Together, these innovators brought a rich tapestry of global perspectives and expertise, propelling unprecedented innovation in the fight against narrative attacks that continues to this day."
        - paragraph [ref=e81]: Today Blackbird.AI is considered a leader in protecting organizations from narrative attacks that cause financial and reputational harm. Our Constellation AI-driven Narrative Intelligence Platform – identifies key narratives that impact organizations, the influence behind them, the networks they touch, the bot behavior that scales them, and the cohorts and communities that connect them. This information enables organizations to proactively understand narrative threats as they scale and become harmful for better strategic decision-making.
